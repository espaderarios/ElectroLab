[package]
name = "electrolab"
version = "1.0.0"
description = "ElectroLab desktop application"
authors = ["ElectroLab"]
edition = "2021"
license = "MIT"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
