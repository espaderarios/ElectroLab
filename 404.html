<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#242630" />
    <title>ElectroLab — Opening project</title>
    <script>
      (function () {
        // Used only if Pages publishes the repository/branch instead of the
        // GitHub Actions dist artifact. The Actions 404 is the built SPA HTML.
        var base = '/ElectroLab/';
        var route = location.pathname + location.search + location.hash;
        try {
          if (location.pathname.indexOf(base) === 0) {
            sessionStorage.setItem('electrolab:spa-return-v1', route);
          }
        } catch (ignored) { /* storage may be disabled */ }
        location.replace(base);
      })();
    </script>
  </head>
  <body>Opening ElectroLab…</body>
</html>
