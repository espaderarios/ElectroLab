<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElectroLab</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var base = path.indexOf('/ElectroLab') === 0 ? '/ElectroLab/' : '/';
        sessionStorage.setItem('spa-redirect', path + window.location.search + window.location.hash);
        window.location.replace(base);
      })();
    </script>
  </head>
  <body>
    Redirecting to ElectroLab…
  </body>
</html>
