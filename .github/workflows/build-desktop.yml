name: Build ElectroLab for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc

      - name: Install ImageMagick
        shell: pwsh
        run: choco install imagemagick.app -y --no-progress

      - name: Prepare Tauri icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons | Out-Null
          magick favicon.png -define icon:auto-resize=256,128,64,48,32,16 src-tauri/icons/icon.ico
          if (-not (Test-Path src-tauri/icons/icon.ico)) {
            throw "Failed to create src-tauri/icons/icon.ico"
          }

      - name: Install frontend dependencies
        run: npm ci

      - name: Build ElectroLab desktop app
        run: npm run tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: ElectroLab-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for desktop tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            (Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -ExpandProperty FullName),
            (Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -ExpandProperty FullName)
          )
          gh release create "$env:GITHUB_REF_NAME" $assets --title "ElectroLab $env:GITHUB_REF_NAME" --generate-notes
