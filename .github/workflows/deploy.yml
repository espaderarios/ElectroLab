name: Deploy ElectroLab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build ElectroLab
        run: npm run build

      # GitHub Pages has no SPA fallback for React Router routes.
      # Built assets use the absolute /ElectroLab/ base. A copy of the built
      # HTML keeps direct /ElectroLab/editor/:projectId links functional on Pages.
      # GitHub Pages may still return HTTP 404 for the initial deep-link document;
      # this fallback renders the React route, with JS/CSS loaded successfully.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
